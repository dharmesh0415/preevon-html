<!doctype html>
<html lang="en" data-theme="light" data-theme-preference="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Preevon project foundation built with Vite, Tailwind CSS, GSAP, Lenis, and Lucide icons."
    />
    <meta name="theme-color" content="#f7f3ec" />
    <title>Preevon</title>
    <script>
      (() => {
        const storageKey = 'preevon-theme';
        const themes = ['light', 'dark', 'system'];
        const savedTheme = window.localStorage.getItem(storageKey);
        const preference = themes.includes(savedTheme) ? savedTheme : 'system';
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
        const resolvedTheme = preference === 'system' ? systemTheme : preference;
        document.documentElement.dataset.theme = resolvedTheme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = resolvedTheme;
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="app"></div>
    <script type="module" src="/src/scripts/app.js"></script>
  </body>
</html>
